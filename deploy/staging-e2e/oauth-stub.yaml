# Staging-only OAuth2 IdP stub, applied with kubectl over SSM — deliberately outside the
# ArgoCD-synced tree so a public-repo sync can never ship it. The id_token it mints is
# UNSIGNED (alg none, junk signature): sufficient because GoogleOAuthProvider decodes the
# payload without verifying the signature, having received the token over the TLS channel
# it initiated. Codes are single-use so the e2e replay scenario has a real refusal to assert.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth-stub-server
  namespace: danteplanner
data:
  server.js: |
    const http = require('http');
    const crypto = require('crypto');
    const CLIENT_ID = process.env.CLIENT_ID;
    const CLIENT_SECRET = process.env.CLIENT_SECRET;
    const ISSUER = 'https://idp-staging.dante-planner.com';
    const codes = new Map();
    const tokens = new Map();
    const b64u = (s) => Buffer.from(s).toString('base64url');
    const subOf = (email) => crypto.createHash('sha256').update(email).digest('hex').slice(0, 21);

    http.createServer((req, res) => {
      const u = new URL(req.url, ISSUER);
      const fail = (status, error) => {
        res.writeHead(status, { 'Content-Type': 'application/json' });
        res.end(JSON.stringify({ error }));
      };

      if (u.pathname === '/healthz') {
        res.writeHead(200);
        return res.end('ok');
      }

      if (u.pathname === '/auth' && req.method === 'GET') {
        const q = u.searchParams;
        if (q.get('client_id') !== CLIENT_ID || q.get('response_type') !== 'code'
            || q.get('code_challenge_method') !== 'S256' || !q.get('code_challenge')
            || !q.get('redirect_uri')) {
          return fail(400, 'invalid_request');
        }
        const email = q.get('login_hint') || 'e2e-user@example.invalid';
        const code = b64u(crypto.randomBytes(24));
        codes.set(code, { challenge: q.get('code_challenge'), email, used: false });
        const loc = new URL(q.get('redirect_uri'));
        loc.searchParams.set('code', code);
        if (q.get('state') !== null) loc.searchParams.set('state', q.get('state'));
        res.writeHead(302, { Location: loc.toString() });
        return res.end();
      }

      if (u.pathname === '/token' && req.method === 'POST') {
        let body = '';
        req.on('data', (c) => { body += c; });
        req.on('end', () => {
          const p = new URLSearchParams(body);
          if (p.get('grant_type') !== 'authorization_code') return fail(400, 'unsupported_grant_type');
          if (p.get('client_id') !== CLIENT_ID || p.get('client_secret') !== CLIENT_SECRET) {
            return fail(401, 'invalid_client');
          }
          const rec = codes.get(p.get('code'));
          if (!rec || rec.used) return fail(400, 'invalid_grant');
          rec.used = true;
          const digest = crypto.createHash('sha256').update(p.get('code_verifier') || '').digest();
          if (Buffer.from(digest).toString('base64url') !== rec.challenge) return fail(400, 'invalid_grant');
          const sub = subOf(rec.email);
          const accessToken = b64u(crypto.randomBytes(24));
          tokens.set(accessToken, { sub, email: rec.email });
          const now = Math.floor(Date.now() / 1000);
          const idToken = [
            b64u(JSON.stringify({ alg: 'none', typ: 'JWT' })),
            b64u(JSON.stringify({ iss: ISSUER, aud: CLIENT_ID, sub, email: rec.email, iat: now, exp: now + 3600 })),
            'unsigned',
          ].join('.');
          res.writeHead(200, { 'Content-Type': 'application/json' });
          res.end(JSON.stringify({
            access_token: accessToken,
            id_token: idToken,
            token_type: 'Bearer',
            expires_in: 3600,
          }));
        });
        return;
      }

      if (u.pathname === '/userinfo' && req.method === 'GET') {
        const rec = tokens.get((req.headers.authorization || '').replace(/^Bearer /, ''));
        if (!rec) return fail(401, 'invalid_token');
        res.writeHead(200, { 'Content-Type': 'application/json' });
        return res.end(JSON.stringify({ id: rec.sub, email: rec.email, verified_email: true }));
      }

      fail(404, 'not_found');
    }).listen(3000);
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth-stub
  namespace: danteplanner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth-stub
  template:
    metadata:
      labels:
        app: oauth-stub
    spec:
      nodeSelector:
        role: data
      containers:
        - name: oauth-stub
          image: node:20-alpine
          command: ["node", "/app/server.js"]
          env:
            - name: CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: backend-runtime-config
                  key: GOOGLE_OAUTH_CLIENT_ID
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-runtime-config
                  key: GOOGLE_OAUTH_CLIENT_SECRET
          volumeMounts:
            - name: server
              mountPath: /app
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: server
          configMap:
            name: oauth-stub-server
---
apiVersion: v1
kind: Service
metadata:
  name: oauth-stub
  namespace: danteplanner
spec:
  selector:
    app: oauth-stub
  ports:
    - port: 3000
      targetPort: 3000
---
# Hostname-scoped: Gateway API prefers a hostname-bearing route over the hostname-less
# backend catch-all, which is what keeps this from shadowing the API.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oauth-stub
  namespace: danteplanner
spec:
  parentRefs:
    - name: web
  hostnames:
    - idp-staging.dante-planner.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: oauth-stub
          port: 3000
