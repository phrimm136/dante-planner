# TrafficDrop: legacy alarm paged on RequestCount Sum < 1 per 5m for 2 periods —
# i.e. total silence at the nginx layer of the old host. The fleet-era signal is
# http_server_requests_seconds_count across two clusters behind Cloudflare, without the
# /actuator requests that probes and scrapes keep sending while a pod lives.
- name: traffic-drop
  kind: prometheus
  for: 10m
  expr: 'sum by (cluster) (increase(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m])) < bool 1'
  cases:
    fires:
      - series:
          - series: 'http_server_requests_seconds_count{cluster="oregon",method="GET",status="200",uri="/actuator/health/**"}'
            values: '0+10x40'
          - series: 'http_server_requests_seconds_count{cluster="oregon",method="GET",status="200",uri="/api/planner/md/published"}'
            values: '0+10x10 100x30'
        at: 30m
    quiet:
      - series:
          - series: 'http_server_requests_seconds_count{cluster="oregon",method="GET",status="200",uri="/actuator/health/**"}'
            values: '0+10x40'
          - series: 'http_server_requests_seconds_count{cluster="oregon",method="GET",status="200",uri="/api/planner/md/published"}'
            values: '0+10x10 100x30'
        at: 8m
      - series:
          - series: 'http_server_requests_seconds_count{cluster="oregon",method="GET",status="200",uri="/actuator/health/**"}'
            values: '0+10x40'
          - series: 'http_server_requests_seconds_count{cluster="oregon",method="GET",status="200",uri="/api/planner/md/published"}'
            values: '0+10x10 100x30'
        at: 20m
      - series:
          - series: 'http_server_requests_seconds_count{cluster="oregon",method="GET",status="200",uri="/actuator/health/**"}'
            values: '0+10x40'
          - series: 'http_server_requests_seconds_count{cluster="oregon",method="GET",status="200",uri="/api/planner/md/published"}'
            values: '0+10x40'
        at: 30m

