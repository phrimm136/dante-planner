          - series: 'node_disk_written_bytes_total{cluster="oregon",instance="node-a",device="nvme0n1"}'
            values: '0+10000000x10 100000000+200000000x30'
        at: 22m
      - series:
          - series: 'node_disk_written_bytes_total{cluster="oregon",instance="node-a",device="nvme0n1"}'
            values: '0+10000000x40'
