# HighCPU: user-mode CPU avg > 70% over 5m
- name: node-high-cpu
  kind: prometheus
  for: 5m
  expr: 'avg by (cluster, instance) (rate(node_cpu_seconds_total{mode="user"}[5m])) * 100 > 70'
  cases:
    fires:
      - series:
          - series: 'node_cpu_seconds_total{cluster="oregon",instance="node-a",cpu="0",mode="user"}'
            values: '0+12x10 120+48x20'
        at: 25m
    quiet:
      - series:
          - series: 'node_cpu_seconds_total{cluster="oregon",instance="node-a",cpu="0",mode="user"}'
            values: '0+12x10 120+48x20'
        at: 16m
      - series:
          - series: 'node_cpu_seconds_total{cluster="oregon",instance="node-a",cpu="0",mode="user"}'
            values: '0+12x30'
        at: 25m

# HighDisk: filesystem used > 85%
- name: node-high-disk
  kind: prometheus
  for: 5m
  expr: '(1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 > 85'
  cases:
    fires:
      - series:
          - series: 'node_filesystem_size_bytes{cluster="oregon",instance="node-a",fstype="ext4",mountpoint="/"}'
            values: '100000000000x20'
          - series: 'node_filesystem_avail_bytes{cluster="oregon",instance="node-a",fstype="ext4",mountpoint="/"}'
            values: '50000000000x4 10000000000x15'
        at: 15m
    quiet:
      - series:
          - series: 'node_filesystem_size_bytes{cluster="oregon",instance="node-a",fstype="ext4",mountpoint="/"}'
            values: '100000000000x20'
          - series: 'node_filesystem_avail_bytes{cluster="oregon",instance="node-a",fstype="ext4",mountpoint="/"}'
            values: '50000000000x4 10000000000x15'
        at: 8m
      - series:
          - series: 'node_filesystem_size_bytes{cluster="oregon",instance="node-a",fstype="tmpfs",mountpoint="/run"}'
            values: '100000000000x20'
          - series: 'node_filesystem_avail_bytes{cluster="oregon",instance="node-a",fstype="tmpfs",mountpoint="/run"}'
            values: '10000000000x20'
        at: 15m

# LowMemory: available < 200 MiB sustained 3 evaluation periods
- name: node-low-memory
  kind: prometheus
  for: 15m
  expr: 'node_memory_MemAvailable_bytes < 209715200'
  cases:
    fires:
      - series:
          - series: 'node_memory_MemAvailable_bytes{cluster="oregon",instance="node-a"}'
            values: '1000000000x4 100000000x30'
        at: 25m
    quiet:
      - series:
          - series: 'node_memory_MemAvailable_bytes{cluster="oregon",instance="node-a"}'
            values: '1000000000x4 100000000x30'
        at: 15m
      - series:
          - series: 'node_memory_MemAvailable_bytes{cluster="oregon",instance="node-a"}'
            values: '1000000000x30'
        at: 25m

# MemoryPSI: fraction of wall-time with at least one task stalled on memory
# reclaim ("some" pressure) > 10% sustained. Catches reclaim thrash that
# MemAvailable alone hides — a host can hang alive without ever OOM-killing.
- name: node-memory-psi
  kind: prometheus
  for: 5m
  expr: 'rate(node_pressure_memory_waiting_seconds_total[5m]) > 0.1'
  cases:
    fires:
      - series:
          - series: 'node_pressure_memory_waiting_seconds_total{cluster="oregon",instance="node-a"}'
            values: '0+1x10 10+12x20'
        at: 25m
    quiet:
      - series:
          - series: 'node_pressure_memory_waiting_seconds_total{cluster="oregon",instance="node-a"}'
            values: '0+1x10 10+12x20'
        at: 16m
      - series:
          - series: 'node_pressure_memory_waiting_seconds_total{cluster="oregon",instance="node-a"}'
            values: '0+3x30'
        at: 25m

