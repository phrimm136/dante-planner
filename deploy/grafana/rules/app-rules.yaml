          - series: 'resilience4j_circuitbreaker_state{cluster="seoul",name="read-source-replica",state="open"}'
            values: '0x4 1x20'
        at: 15m
    quiet:
      - series:
          - series: 'resilience4j_circuitbreaker_state{cluster="seoul",name="read-source-replica",state="open"}'
            values: '0x4 1x20'
        at: 8m
      - series:
