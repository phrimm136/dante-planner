# BackendErrors: any ERROR paged immediately (Sum > 0 over 60s); keep first-occurrence semantics
- name: backend-error-events
  kind: loki
  for: 1m
  expr: 'sum by (cluster, logger_name, shape) (count_over_time({app="backend"} | json | level="ERROR" | label_format shape=`{{ regexReplaceAll "[0-9]+" (regexReplaceAll "[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}" .message "UUID") "N" | trunc 80 }}` [5m])) > 0'
  summary: '{{ $labels.cluster }} {{ $labels.logger_name }}: {{ $labels.shape }}'
  cases:
    fires:
      - lines:
          - stream: {app: backend, cluster: oregon}
            line: '{"level":"ERROR","logger_name":"com.danteplanner.planner.PlannerService","message":"planner 42 failed for 1b4e28ba-2fa1-11d2-883f-0016d3cca427"}'
    quiet:
      - lines:
          - stream: {app: backend, cluster: oregon}
            line: '{"level":"INFO","logger_name":"com.danteplanner.planner.PlannerService","message":"planner 42 saved"}'

# BackendWarnings: WARN > 0 sustained 5 evaluation periods
- name: backend-warn-sustained
  kind: loki
  for: 5m
  expr: 'sum by (cluster, logger_name, shape) (count_over_time({app="backend"} | json | level="WARN" | label_format shape=`{{ regexReplaceAll "[0-9]+" (regexReplaceAll "[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}" .message "UUID") "N" | trunc 80 }}` [5m])) > 0'
  summary: '{{ $labels.cluster }} {{ $labels.logger_name }}: {{ $labels.shape }}'
  cases:
    fires:
      - lines:
          - stream: {app: backend, cluster: seoul}
            line: '{"level":"WARN","logger_name":"com.danteplanner.auth.TokenService","message":"refresh 7 retried"}'
    quiet:
      - lines:
          - stream: {app: backend, cluster: seoul}
            line: '{"level":"INFO","logger_name":"com.danteplanner.auth.TokenService","message":"refresh 7 issued"}'

# BackendSilence: < 1 log event in 20m; kube rules own app-down, this owns pipeline-dead
- name: backend-log-silence
  kind: prometheus
  for: 5m
  expr: 'sum by (cluster) (increase(logback_events_total[20m])) < bool 1'
  cases:
    fires:
      - series:
          - series: 'logback_events_total{cluster="oregon",level="info"}'
            values: '0+10x10 100x50'
        at: 45m
    quiet:
      - series:
          - series: 'logback_events_total{cluster="oregon",level="info"}'
            values: '0+10x10 100x50'
        at: 31m
      - series:
          - series: 'logback_events_total{cluster="oregon",level="info"}'
            values: '0+10x10 100x12 110+10x30'
        at: 22m
      - series:
          - series: 'logback_events_total{cluster="oregon",level="info"}'
            values: '0+10x10 100x12 110+10x30'
        at: 30m
      - series:
          - series: 'logback_events_total{cluster="oregon",level="info"}'
            values: '0+10x10 100x12 110+10x30'
        at: 40m
      - series:
          - series: 'logback_events_total{cluster="oregon",level="info"}'
            values: '0+10x40'
        at: 30m

# HTTP5xx: > 10 per 5m
- name: http-5xx-burst
  kind: prometheus
  for: 0s
  expr: 'sum by (cluster) (increase(http_server_requests_seconds_count{status=~"5.."}[5m])) > 10'
  cases:
    fires:
      - series:
          - series: 'http_server_requests_seconds_count{cluster="oregon",method="GET",status="500",uri="/api/planner"}'
            values: '0+5x20'
        at: 15m
    quiet:
      - series:
          - series: 'http_server_requests_seconds_count{cluster="oregon",method="GET",status="500",uri="/api/planner"}'
            values: '0+1x20'
        at: 15m
      - series:
          - series: 'http_server_requests_seconds_count{cluster="oregon",method="GET",status="200",uri="/api/planner"}'
            values: '0+50x20'
        at: 15m

# HTTP429: > 20 per 5m
- name: http-429-burst
