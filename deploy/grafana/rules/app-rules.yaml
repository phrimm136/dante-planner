# Marker TTL is 1 hour (ADR 183): safe only while the Seoul replica lags far below it.
- name: seoul-replica-lag
  kind: cloudwatch
  for: 5m
  metric: ReplicaLag
  db_instance: danteplanner-mysql-seoul
  region: ap-northeast-2
  threshold: 60
