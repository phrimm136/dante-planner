# mysqld_exporter per region on the data node, scraped locally by Prometheus.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mysqld-exporter
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-mysql-exporter
    targetRevision: 2.17.1
    helm:
      releaseName: mysqld-exporter
      valuesObject:
        fullnameOverride: mysqld-exporter
        podLabels:
          app: mysqld-exporter
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/path: /metrics
          prometheus.io/port: "9104"
          prometheus.io/job: mysqld
        mysql:
          existingConfigSecret:
            name: mysqld-exporter-dsn
            key: my.cnf
        config:
          extraArgs:
            - --mysqld.address=$(MYSQLD_ADDRESS)
            - --mysqld.username=$(MYSQL_EXPORTER_USER)
        collectors:
          perf_schema.eventsstatements: true
          perf_schema.tableiowaits: true
        extraEnvs:
          # Must dial the name on the server certificate, not the Route53 alias.
          - name: MYSQLD_ADDRESS
            valueFrom:
              secretKeyRef:
                name: mysqld-exporter-dsn
                key: endpoint
          - name: MYSQL_EXPORTER_USER
            valueFrom:
              secretKeyRef:
                name: mysqld-exporter-dsn
                key: username
          - name: MYSQLD_EXPORTER_PASSWORD
            valueFrom:
              secretKeyRef:
                name: mysqld-exporter-dsn
                key: password
        extraVolumes:
          - name: rds-ca
            configMap:
              name: rds-ca-bundle
        extraVolumeMounts:
          - name: rds-ca
            mountPath: /etc/mysqld-certs
            readOnly: true
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        nodeSelector:
          role: data
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: danteplanner
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mysqld-exporter-dsn
  namespace: danteplanner
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: mysqld-exporter-dsn
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      data:
        my.cnf: {{ .Files.Get "files/mysqld-tls.cnf" | toJson }}
  data:
    - secretKey: username
      remoteRef:
        key: danteplanner/mysqld-exporter/dsn
        property: username
    - secretKey: password
      remoteRef:
        key: danteplanner/mysqld-exporter/dsn
        property: password
    - secretKey: endpoint
      remoteRef:
        key: danteplanner/mysqld-exporter/dsn
        property: {{ .Values.mysqldEndpointProperty }}
