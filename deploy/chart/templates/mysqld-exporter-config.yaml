apiVersion: v1
kind: ConfigMap
metadata:
  name: mysqld-tls-cnf
  namespace: danteplanner
data:
  mysqld-tls.cnf: {{ .Files.Get "files/mysqld-tls.cnf" | toJson }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rds-ca-bundle
  namespace: danteplanner
data:
  rds-global-bundle.pem: {{ .Files.Get "files/rds-global-bundle.pem" | toJson }}
