# node_exporter on every node via DaemonSet — host memory, PSI, and saturation
# signals that neither KSM (apiserver state only) nor CloudWatch basic EC2
# metrics (no memory) can see. Collector set is restricted to the incident-
# driven families; the remote_write keep-list further bounds what ships.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-exporter
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-node-exporter
    # From 6.0.0 on, set defaultArgs: [] below, or the chart adds its filesystem exclude flags to extraArgs.
    targetRevision: 5.2.0
    helm:
      releaseName: node-exporter
      valuesObject:
        fullnameOverride: node-exporter
        podLabels:
          app: node-exporter
        service:
          enabled: false
        serviceAccount:
          create: false
        rbac:
          create: false
        hostRootFsMount:
          enabled: false
        tolerations:
          - operator: Exists
        podAnnotations:
          prometheus.io/scrape: "true"
          prometheus.io/path: /metrics
          prometheus.io/port: "9100"
          prometheus.io/job: node
        extraArgs:
          - --collector.disable-defaults
          - --collector.meminfo
          - --collector.cpu
          - --collector.pressure
          - --collector.filesystem
          - --collector.loadavg
          - --collector.conntrack
          - --collector.diskstats
          - --collector.netdev
          - --collector.netdev.device-exclude=^(lo|veth.*|cni.*|flannel.*)$
        resources:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            memory: 48Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: privileged-exporter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
