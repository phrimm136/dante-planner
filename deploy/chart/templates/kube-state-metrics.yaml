apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-state-metrics
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-state-metrics
    targetRevision: 9.0.1
    helm:
      releaseName: kube-state-metrics
      valuesObject:
        fullnameOverride: kube-state-metrics
        nodeSelector:
          role: data
        podAnnotations:
          prometheus.io/scrape: "true"
          prometheus.io/path: /metrics
          prometheus.io/port: "8080"
          prometheus.io/job: kube-state-metrics
        collectors:
          - nodes
          - pods
          - daemonsets
        metricAllowlist:
          - kube_node_status_condition
          - kube_node_spec_taint
          - kube_pod_status_phase
          - kube_pod_status_ready
          - kube_pod_container_status_restarts_total
          - kube_pod_container_status_waiting_reason
          - kube_daemonset_status_desired_number_scheduled
          - kube_daemonset_status_number_ready
          - kube_etcd_snapshot_creation_timestamp_seconds
          - kube_node_info
          - kube_pod_info
          - kube_pod_container_resource_requests
          - kube_pod_container_resource_limits
          - kube_node_status_allocatable
          - kube_pod_container_status_last_terminated_reason
        customResourceState:
          enabled: true
          config:
            kind: CustomResourceStateMetrics
            spec:
              resources:
                - groupVersionKind:
                    group: k3s.cattle.io
                    version: "v1"
                    kind: ETCDSnapshotFile
                  metricNamePrefix: kube_etcd
                  labelsFromPath:
                    name: [metadata, name]
                    node: [spec, nodeName]
                  metrics:
                    - name: snapshot_creation_timestamp_seconds
                      help: "Unix timestamp of the etcd snapshot creation time; age = time() - this metric"
                      each:
                        type: Gauge
                        gauge:
                          path: [status, creationTime]
        rbac:
          extraRules:
            - apiGroups: ["k3s.cattle.io"]
              resources: ["etcdsnapshotfiles"]
              verbs: ["list", "watch"]
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: danteplanner
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
