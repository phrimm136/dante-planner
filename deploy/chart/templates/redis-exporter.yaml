# One redis_exporter per Redis instance: annotation-based discovery cannot carry
# per-target query params, so multi-target mode is out and each instance gets its
# own exporter under its own job label. Auth instance password rides the same
# backend-runtime-config key the server itself uses. Observers live on the
# data node, untouched by the surge pipeline.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-exporter-auth
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-redis-exporter
    targetRevision: 6.37.0
    helm:
      releaseName: redis-exporter-auth
      valuesObject:
        fullnameOverride: redis-exporter-auth
        labels:
          app: redis-exporter-auth
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/path: /metrics
          prometheus.io/port: "9121"
          prometheus.io/job: redis-auth
        redisAddress: redis://redis-auth:6379
        auth:
          enabled: true
          secret:
            name: backend-runtime-config
            key: AUTH_REDIS_PASSWORD
        serviceAccount:
          create: false
        rbac:
          create: false
        podSecurityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        nodeSelector:
          role: data
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: danteplanner
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
---
