apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: danteplanner
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: danteplanner
data:
{{ toYaml .Values.backendConfig | indent 2 }}
