# Ships pod logs to Grafana Cloud Loki via the kubelet API (no hostPath), labeled
# with the per-region cluster identity. Loki credentials (stack logs id + token
# with logs:write) arrive via Secrets Manager -> ESO -> file mounts — the logs id
# is account-identifying and this repo is public, so only the shared push URL is
# committed. One Deployment per cluster on the data node, like the other observers.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.16.0
    helm:
      releaseName: alloy
      valuesObject:
        fullnameOverride: alloy
        crds:
          create: false
        global:
          podSecurityContext:
            runAsNonRoot: true
            runAsUser: 473
            runAsGroup: 473
            seccompProfile:
              type: RuntimeDefault
        alloy:
          configMap:
            create: false
            name: alloy-logs-config
            key: config.alloy
          listenAddr: 127.0.0.1
          enableHttpServerPort: false
          enableReporting: false
          envFrom:
            - configMapRef:
                name: cluster-identity
          extraEnv:
            - name: LOKI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: grafana-loki-write
                  key: username
          mounts:
            extra:
              - name: loki-auth
                mountPath: /etc/alloy/loki
                readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 128Mi
        configReloader:
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
        controller:
          podLabels:
            app: alloy-logs
          type: deployment
          nodeSelector:
            role: data
          volumes:
            extra:
              - name: loki-auth
                secret:
                  secretName: grafana-loki-write
        rbac:
          rules:
            - apiGroups: [""]
              resources: ["pods"]
              verbs: ["get", "list", "watch"]
          clusterRules:
            - apiGroups: [""]
              resources: ["pods/log"]
              verbs: ["get"]
        service:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: danteplanner
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-loki-write
  namespace: danteplanner
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: grafana-loki-write
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: danteplanner/grafana/cloud
        property: loki_username
    - secretKey: password
      remoteRef:
        key: danteplanner/grafana/cloud
        property: loki_password
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-logs-config
  namespace: danteplanner
data:
  config.alloy: |
    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "app"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.write.grafana_cloud.receiver]
    }

    loki.write "grafana_cloud" {
      endpoint {
        url = "https://logs-prod-036.grafana.net/loki/api/v1/push"
        basic_auth {
          username      = sys.env("LOKI_USERNAME")
          password_file = "/etc/alloy/loki/password"
        }
      }
      external_labels = {
        cluster = sys.env("CLUSTER_NAME"),
      }
    }
