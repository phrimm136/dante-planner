# Names the cluster on metrics and logs, and selects the Cloudflare tunnel token.
region: oregon
image:
  tag: "cc044489b9621fa31ef60f6eb819e1f1ceb92848"
awsRegion: us-west-2
mysqldEndpointKey: primary-endpoint
redisAuth:
  nodePort: 31637
backendConfig:
  DEPLOY_REGION: us-west-2
  # In-cluster service DNS (region-invariant shape, region-local instances).
  REDIS_AUTH_HOST: redis-auth.danteplanner.svc.cluster.local
  REDIS_RATELIMIT_HOST: redis-ratelimit.danteplanner.svc.cluster.local
  # Auth read-local endpoint. Single-region Oregon: == REDIS_AUTH_HOST, so
  # blacklist/freshness marker reads and writes share the one auth store (no-op split).
  # Seoul repoints this at the local replica. Must be set explicitly: the app's
  # ${AUTH_LOCAL_REDIS_HOST:${AUTH_REDIS_HOST:localhost}} default cannot see the
  # relaxed-bound REDIS_AUTH_HOST, so an unset value resolves to a dead localhost
  # and fail-opens every revocation check.
  REDIS_AUTHLOCAL_HOST: redis-auth.danteplanner.svc.cluster.local
  # SSE subscribe endpoint. Single-region: == REDIS_AUTH_HOST, so a pod subscribes
  # to the same store it publishes to and cross-pod fan-out works. Unset resolves
  # to a dead localhost (same relaxed-binding trap as auth-local) and silently
  # kills the Redis subscribe path. Seoul repoints this at the local replica.
  REDIS_SSELOCAL_HOST: redis-auth.danteplanner.svc.cluster.local
  DATASOURCE_READSOURCES_0_NAME: primary
  DATASOURCE_READSOURCES_1_NAME: seoul-replica
  DATASOURCE_READSOURCES_1_URL: "jdbc:mysql://mysql-replica.seoul.danteplanner.internal:${MYSQL_PORT:3306}/${MYSQL_DATABASE:danteplanner}?sslMode=VERIFY_CA&serverTimezone=UTC&connectTimeout=${DB_CONNECT_TIMEOUT_MS:10000}&socketTimeout=15000&trackSessionState=true&trustCertificateKeyStoreUrl=file:/app/certs/rds-truststore.p12&trustCertificateKeyStoreType=PKCS12&trustCertificateKeyStorePassword=changeit"
  # DB connection (MYSQL_HOST/DATABASE/USER/PASSWORD) + SENTRY_DSN come from the
  # backend-runtime-config Secrets Manager bundle (runtime-config.yaml), not here —
  # environment-specific and secret values stay out of the committed values.
