id: no-hover-scale-tsx
language: Tsx
severity: error
message: The card layers are transcribed at the game geometry; a hover scale moves them off it. Reveal the hover ring instead of scaling the card.
files:
  - src/**/*.tsx
rule:
  any:
    - kind: string
      regex: 'hover:scale-'
    - kind: template_string
      regex: 'hover:scale-'
    - kind: string
      regex: '(?s)(:hover.*scale\(|scale\(.*:hover)'
    - kind: template_string
      regex: '(?s)(:hover.*scale\(|scale\(.*:hover)'
