id: no-throw-in-lib
language: TypeScript
severity: error
message: "lib is the functional core and never throws: refuse the state at the schema boundary so the parsed type cannot carry it, or handle it in a boundary adapter."
files:
  - src/pages/*/lib/**
  - src/shared/*/lib/**
ignores:
  - '**/__tests__/**'
rule:
  pattern: throw $ERR
