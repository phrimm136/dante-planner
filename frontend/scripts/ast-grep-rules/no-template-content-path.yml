id: no-template-content-path
language: TypeScript
severity: error
message: 'ADR 140: a content path is a typed value rendered to text only at the edge; build it with the content-path helper, not a template literal or string concatenation.'
files:
  - src/pages/planner/lib/floorRules.ts
  - src/pages/planner/lib/plannerValidation.ts
  - src/pages/planner/lib/plannerValidationErrors.ts
rule:
  any:
    - kind: template_string
      all:
        - regex: '^`[^\s`]*`$'
        - regex: '\[\$\{|\.\$\{|\}\.|\}\['
        - has: { kind: template_substitution }
    - kind: binary_expression
      all:
        - has: { field: operator, regex: '^\+$' }
        - has:
            kind: string
            regex: '^[''"]([.\[\]][^\s''"]*|[^\s''"]*[.\[])[''"]$'
