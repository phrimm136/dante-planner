id: no-violation-push
language: TypeScript
severity: error
message: 'ADR 140: a content rule returns its violations as values; build the list with flatMap, map, filter or spread instead of pushing into a collector array.'
files:
  - src/pages/planner/lib/validation/**
ignores:
  - '**/__tests__/**'
rule:
  pattern: $ARR.push($$$ITEMS)
constraints:
  ARR:
    regex: '(^|\.)(errors|violations|issues|\w+(Errors|Violations|Issues))$'
