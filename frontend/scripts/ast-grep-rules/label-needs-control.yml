id: label-needs-control
language: Tsx
severity: error
message: A label with no htmlFor and no wrapped input, select or textarea names nothing; point htmlFor at the control's id, wrap the control, or, for a heading over a group of buttons, use <span id> with role="group" aria-labelledby on the group.
files:
  - src/**/*.tsx
ignores:
  - '**/__tests__/**'
  - '**/*.test.tsx'
rule:
  kind: jsx_element
  has:
    field: open_tag
    all:
      - has:
          field: name
          regex: ^label$
      - not:
          has:
            kind: jsx_attribute
            has:
              kind: property_identifier
              regex: ^htmlFor$
  not:
    has:
      stopBy: end
      any:
        - kind: jsx_self_closing_element
        - kind: jsx_opening_element
      has:
        field: name
        regex: ^(input|select|textarea|Input)$
