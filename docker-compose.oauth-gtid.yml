# Stub-OAuth + GTID overlay: what the compose stack needs before the e2e suites can drive
# it. Runs the OAuth stub IdP beside the app, enables GTID session tracking so the
# read-your-writes gate can capture and mint, and wires the single-region gate flags. The
# backend trusts the repo test keypair through the override's /app/keys mount, and the
# suites sign with the same pair (E2E_STAGING_KEY_FILE). The authorize URL is
# browser-facing (host port), while the token/userinfo URLs are container-facing (service
# DNS) — the same split staging uses.
services:
  mysql:
    ports:
      - "3306:3306"
    # GTID tracking is what the read-your-writes gate captures; without it the local server
    # names no GTID and the cookie can never be minted, so the gate is untestable here.
    command:
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --session-track-gtids=OWN_GTID
      - --sql-mode=ONLY_FULL_GROUP_BY,STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION

  backend:
    environment:
      GOOGLE_OAUTH_CLIENT_ID: staging-stub
      GOOGLE_OAUTH_CLIENT_SECRET: ${STUB_CLIENT_SECRET}
      GOOGLE_OAUTH_REDIRECT_URI: http://localhost/api/auth/google/callback
      GOOGLE_OAUTH_AUTHORIZE_URL: http://localhost:3000/auth
      GOOGLE_OAUTH_TOKEN_URL: http://oauth-stub:3000/token
      GOOGLE_OAUTH_USER_INFO_URL: http://oauth-stub:3000/userinfo
      GOOGLE_OAUTH_JWKS_URI: http://oauth-stub:3000/jwks
      GOOGLE_OAUTH_ISSUER: https://idp-staging.dante-planner.com
      # Single-region stand-in for Seoul: the gate filter registers on this flag alone, and the
      # "replica" is the same server, which is enough to exercise capture and cookie minting.
      #
      # DO NOT run read-your-writes (suite C) against this overlay. One database means lag is
      # always zero, so every gate assertion passes without the gate ever engaging — a green
      # tick that proves nothing. Suite C belongs on docker-compose.multiregion.yml, where the
      # replica is real and the lag is a knob (SOURCE_DELAY).
      DATASOURCE_ROUTING_ENABLED: "true"
      DATASOURCE_REPLICA_ENABLED: "true"
      # trackSessionState is not optional here: without it Connector/J never exposes the
      # server's GTID tracking, capture falls to the fallback branch, and the gate is untestable.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?sslMode=REQUIRED&serverTimezone=UTC&allowPublicKeyRetrieval=true&trackSessionState=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      DATASOURCE_REPLICA_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?sslMode=REQUIRED&serverTimezone=UTC&allowPublicKeyRetrieval=true&trackSessionState=true
      DATASOURCE_REPLICA_USERNAME: ${MYSQL_USER}
      DATASOURCE_REPLICA_PASSWORD: ${MYSQL_PASSWORD}

  oauth-stub:
    image: node:20-alpine
    command: ["node", "/app/server.js"]
    volumes:
      - ./e2e/stub:/app:ro
      - ./backend/src/test/resources/test-keys:/keys:ro
    environment:
      CLIENT_ID: staging-stub
      CLIENT_SECRET: ${STUB_CLIENT_SECRET}
      ID_TOKEN_KEY_FILE: /keys/private_key.pem
    ports:
      - "3000:3000"
    networks:
      - danteplanner-network
