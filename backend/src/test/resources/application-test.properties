spring.application.name=Backend-Test

# Allow bean definition override for test configuration
spring.main.allow-bean-definition-overriding=true

# H2 In-Memory Database Configuration for Tests
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
# Never drop: every context on this profile shares one in-memory database (the URL names it
# explicitly), so a closing context running create-drop takes the schema out from under the
# contexts still using it. update creates what is missing and removes nothing.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Flyway for tests (use JPA auto-DDL instead)
spring.flyway.enabled=false

# JWT Configuration for Tests
jwt.private-key-path=src/test/resources/test-keys/private_key.pem
jwt.public-key-path=src/test/resources/test-keys/public_key.pem
jwt.encryption-key=E9dzesGJ+MrmIaVssATsvvP9EOc1M/Cj/u+9Bh1WTBg=
jwt.access-token-expiry=900000
jwt.refresh-token-expiry=604800000

# CORS Configuration
cors.allowed-origins=http://localhost:5173

# OAuth Configuration (disabled for tests)
oauth.google.client-id=test-client-id
oauth.google.client-secret=test-client-secret
oauth.google.redirect-uri=http://localhost:5173/auth/callback

# Rate Limiting Configuration for Tests
rate-limit.crud.capacity=60
rate-limit.crud.refill-tokens=60
rate-limit.crud.refill-duration-seconds=60
rate-limit.import-config.capacity=10
rate-limit.import-config.refill-tokens=10
rate-limit.import-config.refill-duration-seconds=60
rate-limit.sse.capacity=1
rate-limit.sse.refill-tokens=1
rate-limit.sse.refill-duration-seconds=60

# Planner Configuration for Tests
planner.max-per-user=100
planner.recommended-threshold=10
planner.schema-version=2

# Planner Validation for Tests
planner.validation.max-content-size=51200
planner.validation.max-note-size=1024

# User Deletion Configuration for Tests
app.user.deletion.grace-period-days=30
app.user.cleanup.cron=0 0 3 * * *

# Cookie Configuration for Tests (secure=true for security tests)
cookie.secure=true
cookie.domain=
cookie.same-site=Lax

# spring-data-redis is on the classpath, but this profile provides no Redis endpoint, so the
# auto-configured redis health contributor is disabled to keep context health independent of Redis.
management.health.redis.enabled=false

# A refused port, not application.properties' localhost:6379: the blacklist is keyed by bare user id
# and every test database restarts auto-increment at 1, so a shared Redis lets one class revoke
# another's token. Every client here degrades on an unreachable endpoint. The placeholder chain is
# kept so a class registering its own endpoint still wins.
redis.auth.host=${AUTH_REDIS_HOST:127.0.0.1}
redis.auth.port=${AUTH_REDIS_PORT:1}
redis.rate-limit.host=${RATE_LIMIT_REDIS_HOST:127.0.0.1}
redis.rate-limit.port=${RATE_LIMIT_REDIS_PORT:1}
redis.sse-local.host=${SSE_LOCAL_REDIS_HOST:127.0.0.1}
redis.sse-local.port=${SSE_LOCAL_REDIS_PORT:1}
redis.auth-local.host=${AUTH_LOCAL_REDIS_HOST:${AUTH_REDIS_HOST:127.0.0.1}}
redis.auth-local.port=${AUTH_LOCAL_REDIS_PORT:${AUTH_REDIS_PORT:1}}

# Domain event outbox relay: never fires on its own during a test run; the classes that
# exercise it invoke it directly.
outbox.relay.fixed-delay-ms=86400000
outbox.relay.grace=PT1M
outbox.relay.batch-size=200
