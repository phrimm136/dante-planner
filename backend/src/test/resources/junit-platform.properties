# The suite runs in one JVM (maxParallelForks = 1), twelve classes at a time, and the methods of one
# class run on one thread.
#
# Concurrent classes share one mysqld, one Redis and one Spring context per configuration, so every
# class confines itself to the rows and keys it created. src/test/CLAUDE.md states those rules and
# architecture/TestIsolationConventionTest scans for the ways to break them.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent

# Classes at a time. The work is I/O-bound (Docker, context startup, JDBC), so a thread uses well
# under a core.
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=12

# Random order, so a dependence on who ran first fails on its own rather than as somebody else's
# assertion. A test that only passes in one order is already broken; ordering it deliberately just
# decides which run finds out. The seed is reported in the build output — pass it back through
# junit.jupiter.execution.order.random.seed to replay a specific failure.
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$Random
junit.jupiter.testmethod.order.default=org.junit.jupiter.api.MethodOrderer$Random
