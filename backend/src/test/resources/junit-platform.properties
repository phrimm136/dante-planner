# Classes run concurrently, methods within a class do not. Only the global setting can express
# that split: @Execution on a class propagates to its methods, and concurrent methods share the
# class's @BeforeEach fixtures.
#
# Classes that do not own their datasource opt out with @ResourceLock(SHARED_DATASOURCE), because
# Spring keys its context cache on configuration and classes configured alike share one database.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent

# Threads per fork. The work is I/O-bound (Docker, context startup, JDBC), so a worker uses well
# under a core and the useful thread count exceeds what the core count suggests.
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=3
