id: no-throw-per-violation
valid:
  - |
    class A {
      void m(PlannerValidationException exception) {
        throw exception;
      }
    }
  - |
    class A {
      void m() { throw new IllegalArgumentException("'rules' must be an object"); }
    }
  - |
    class A {
      List<Violation> m(String path, String giftId) {
        return List.of(Violation.duplicateValue(path, giftId));
      }
    }
invalid:
  - |
    class A {
      void m() { throw new PlannerValidationException("MISSING_TITLE", "Title is required for publishing"); }
    }
  - |
    class A {
      PlannerValidationException m(String code, String message) {
        return new PlannerValidationException(code, message);
      }
    }
  - |
    class A {
      void m(ValidationContext context, Violation violation) {
        context.reject(violation.path(), path -> new PlannerValidationException(violation.code().getCode(), violation.message()));
      }
    }
  - |
    class A {
      void m(Violation violation) {
        throw PlannerValidationException.refusing(new ContentVerdict.Refused(violation), null);
      }
    }
  - |
    class A {
      void m(ContentVerdict.Rejected rejected, String content) {
        throw org.danteplanner.backend.planner.exception.PlannerValidationException.rejecting(rejected, content);
      }
    }
  - |
    class A {
      PlannerValidationException m(ContentVerdict.Refused refused) {
        return PlannerValidationException.refusing(refused, null);
      }
    }
  - |
    class A {
      void m(Violation violation) {
        PlannerValidationException failure = PlannerValidationException.refusing(new ContentVerdict.Refused(violation), null);
        throw failure;
      }
    }
