  - |
    class A {
      Map<String, JsonNode> m(JsonNode container) {
        Map<String, JsonNode> bySinnerKey = new HashMap<>();
        for (Map.Entry<String, JsonNode> entry : container.properties()) {
          int index;
          index = Integer.parseInt(entry.getKey());
          bySinnerKey.put(String.valueOf(index), entry.getValue());
        }
        return bySinnerKey;
      }
