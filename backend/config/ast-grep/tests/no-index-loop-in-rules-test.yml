id: no-index-loop-in-rules
valid:
  - |
    class A {
      List<Violation> m(List<Floor> floors) {
        return IntStream.range(0, floors.size())
            .mapToObj(index -> check(floors.get(index), index))
            .flatMap(List::stream)
            .toList();
      }
    }
  - |
    class A {
      List<Violation> m(JsonNode node) {
        return switch (node.getNodeType()) {
          case ARRAY -> elements(node);
          default -> List.of();
        };
      }
    }
  - |
    class A {
      Optional<String> m(List<String> ids) {
        for (String id : ids) {
          if (unknown(id)) {
            return Optional.of(id);
          }
        }
        return Optional.empty();
      }
    }
  - |
    class A {
      void m(List<StringBuilder> builders) {
        for (StringBuilder builder : builders) {
          builder.append('x');
        }
      }
    }
  - |
    class A {
      List<Violation> m(List<Floor> floors) {
        List<Violation> all = new ArrayList<>();
        for (Floor floor : floors) {
          List<Violation> local = new ArrayList<>();
          local.add(check(floor));
        }
        return all;
      }
    }
