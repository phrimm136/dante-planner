id: no-throw-per-violation
snapshots:
  ? |
    class A {
      PlannerValidationException m(String code, String message) {
        return new PlannerValidationException(code, message);
      }
    }
  : labels:
    - source: new PlannerValidationException(code, message)
      style: primary
      start: 83
      end: 128
    - source: PlannerValidationException
      style: secondary
      start: 87
      end: 113
  ? |
    class A {
      void m() { throw new PlannerValidationException("MISSING_TITLE", "Title is required for publishing"); }
    }
  : labels:
    - source: new PlannerValidationException("MISSING_TITLE", "Title is required for publishing")
      style: primary
      start: 29
      end: 112
    - source: PlannerValidationException
      style: secondary
      start: 33
      end: 59
  ? |
    class A {
      void m(ValidationContext context, Violation violation) {
        context.reject(violation.path(), path -> new PlannerValidationException(violation.code().getCode(), violation.message()));
      }
    }
  : labels:
    - source: new PlannerValidationException(violation.code().getCode(), violation.message())
      style: primary
      start: 114
      end: 193
    - source: PlannerValidationException
      style: secondary
      start: 118
      end: 144
