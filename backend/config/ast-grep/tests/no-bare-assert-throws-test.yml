id: no-bare-assert-throws
valid:
  - |
    class A {
      void m() {
        var e = assertThrows(IllegalStateException.class, () -> f());
        assertEquals("boom", e.getMessage());
      }
    }
  - |
    class A {
      IllegalStateException m() {
        return assertThrows(IllegalStateException.class, () -> f());
      }
    }
  - |
    class A {
      void m() {
        assertThat(assertThrows(IllegalStateException.class, () -> f())).hasMessage("boom");
      }
    }
  - |
    class A {
      void m() {
        assertRejected(() -> f()).withCode("PLANNER_NOT_FOUND");
      }
    }
  - |
    class A {
      void m() {
        Rejections.assertRejected(() -> f()).withViolation("UNKNOWN_FIELD", "x");
      }
    }
  - |
    class A {
      void m() {
        assertRejected(() -> f()).withCode("UNAUTHORIZED").isExactlyInstanceOf(InvalidTokenException.class);
      }
    }
  - |
    class A {
      void m() {
        assertThatThrownBy(() -> f()).isInstanceOf(IllegalStateException.class).hasMessage("boom");
      }
    }
  - |
    class A {
      void m() {
        assertThatThrownBy(() -> f())
            .isInstanceOf(IllegalStateException.class)
            .satisfies(e -> assertThat(e.getCause()).isSameAs(cause));
      }
    }
  - |
    class A {
      void m() {
        assertThatThrownBy(() -> f()).hasMessageContaining("boom").isInstanceOf(IllegalStateException.class);
      }
    }
  - |
    class A {
      void m() {
        assertThatExceptionOfType(IllegalStateException.class).isThrownBy(() -> f()).withMessage("boom");
      }
    }
  - |
    class A {
      void m() {
        assertThat(result).isInstanceOf(Planner.class);
      }
    }
  - |
    class A {
      void m() {
        assertThat(future).succeedsWithin(BUDGET, InstanceOfAssertFactories.THROWABLE).isInstanceOf(X.class).hasMessage("boom");
      }
    }
  - |
    class A {
      void m() {
        assertThat(future).succeedsWithin(BUDGET).isEqualTo(value);
      }
    }
  - |
    class A {
      void m() {
        assertThat(future).failsWithin(BUDGET).withThrowableOfType(ExecutionException.class).withMessageContaining("boom");
      }
    }
  - |
    class A {
      void m() {
        assertThat(stream).as("ends").succeedsWithin(Duration.ofMillis(PROMPT_CLOSE_MS));
      }
    }
  - |
    class A {
      void m() {
        assertThat(future).failsWithin(BUDGET).withThrowableOfType(ExecutionException.class).withCauseInstanceOf(RedisException.class).withMessageContaining("boom");
      }
    }
  - |
    class A {
      void m() {
        assertThat(future).failsWithin(BUDGET).withThrowableOfType(ExecutionException.class).havingCause().isInstanceOf(RedisException.class).hasMessage("boom");
      }
    }
  - |
    class A {
      void m() {
        assertThat(future).failsWithin(BUDGET).withThrowableThat().havingRootCause().withMessage("boom");
      }
    }
  - |
    class A {
      void m() {
        assertThatExceptionOfType(X.class).isThrownBy(() -> f()).withCauseInstanceOf(Y.class).withMessage("boom");
      }
    }
  - |
    class A {
      void m() {
        assertThatThrownBy(() -> a()).cause().hasMessageContaining("rejected value");
      }
    }
  - |
    class A {
      void m() {
        assertThatThrownBy(() -> a()).isInstanceOf(X.class).rootCause().isInstanceOf(Y.class).hasMessageContaining("boom");
      }
    }
