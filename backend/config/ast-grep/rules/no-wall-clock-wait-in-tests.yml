id: no-wall-clock-wait-in-tests
language: Java
severity: error
message: 'A test does not wait on the wall clock: inject a Clock, assert the resulting state directly, or derive the bound from the alternative it rules out (backend/src/test/CLAUDE.md, Mechanics).'
files:
  - src/test/java/**/*.java
ignores:
  - src/test/java/org/danteplanner/backend/auth/token/RefreshRotationServiceIT.java
  - src/test/java/org/danteplanner/backend/controller/CommentControllerIT.java
  - src/test/java/org/danteplanner/backend/integration/AdminRoleWriteSkewIT.java
  - src/test/java/org/danteplanner/backend/integration/AdminWithdrawalWriteSkewIT.java
  - src/test/java/org/danteplanner/backend/integration/CausalHarnessSupport.java
  - src/test/java/org/danteplanner/backend/integration/ConsistencyRunIT.java
  - src/test/java/org/danteplanner/backend/integration/DeactivatedOwnerVisibilityIT.java
  - src/test/java/org/danteplanner/backend/integration/DegradationIT.java
  - src/test/java/org/danteplanner/backend/integration/MySQLIT.java
  - src/test/java/org/danteplanner/backend/integration/OregonReadFallbackIT.java
  - src/test/java/org/danteplanner/backend/integration/PlannerCatalogRemovalConcurrencyIT.java
  - src/test/java/org/danteplanner/backend/integration/PlannerFilterRowsConcurrencyIT.java
  - src/test/java/org/danteplanner/backend/integration/PlannerUpsertConflictIT.java
  - src/test/java/org/danteplanner/backend/integration/PlannerViewLockOrderIT.java
  - src/test/java/org/danteplanner/backend/integration/PublishedPlannerDetailIT.java
  - src/test/java/org/danteplanner/backend/integration/ReadSourceOutageIT.java
  - src/test/java/org/danteplanner/backend/integration/RedisConnectionRecoveryIT.java
  - src/test/java/org/danteplanner/backend/integration/ReplicationControl.java
  - src/test/java/org/danteplanner/backend/integration/ReplicationProxyIT.java
  - src/test/java/org/danteplanner/backend/integration/TwoRegionHarnessIT.java
  - src/test/java/org/danteplanner/backend/integration/UserResolutionIT.java
  - src/test/java/org/danteplanner/backend/integration/VoteNotificationFlowIT.java
  - src/test/java/org/danteplanner/backend/shared/config/LazyConnectingProxyManagerTest.java
  - src/test/java/org/danteplanner/backend/shared/freshness/MarkerStoreConnectBoundTest.java
  - src/test/java/org/danteplanner/backend/shared/freshness/MarkerStoreContextIT.java
  - src/test/java/org/danteplanner/backend/shared/freshness/MarkerStoreIT.java
  - src/test/java/org/danteplanner/backend/shared/freshness/MarkerStoreReplicationIT.java
  - src/test/java/org/danteplanner/backend/shared/freshness/RaiseBatcherTest.java
  - src/test/java/org/danteplanner/backend/shared/gtid/GtidReadGateTest.java
  - src/test/java/org/danteplanner/backend/shared/sse/SseHeartbeatSweepTest.java
  - src/test/java/org/danteplanner/backend/shared/sse/SseShutdownDrainTest.java
  - src/test/java/org/danteplanner/backend/support/SseStream.java
  - src/test/java/org/danteplanner/backend/support/SseTopicRecorder.java
utils:
  awaitility-chain:
    has:
      field: object
      regex: ^(org\.awaitility\.)?(Awaitility\.)?(await|with|given)\s*\(
rule:
  any:
    - pattern: $SLEEPER.sleep($$$)
      has:
        field: object
        regex: ^(java\.lang\.)?Thread$|(^|\.)(NANOSECONDS|MICROSECONDS|MILLISECONDS|SECONDS|MINUTES|HOURS|DAYS)$
    - kind: method_invocation
      regex: ^sleep\s*\(
      inside:
        kind: program
        stopBy: end
        has:
          kind: import_declaration
          regex: ^import\s+static\s+java\.lang\.Thread\.(sleep|\*)\s*;$
    - pattern: $LOCK_SUPPORT.$PARK($$$)
      all:
        - has:
            field: object
            regex: ^(java\.util\.concurrent\.locks\.)?LockSupport$
        - has:
            field: name
            regex: ^park(Nanos|Until)$
    - pattern: $ACTUAL.succeedsWithin($$$)
    - pattern: $ACTUAL.failsWithin($$$)
    - pattern: $FUTURE.orTimeout($$$)
    - pattern: $AWAIT.atMost($$$)
      matches: awaitility-chain
    - pattern: $AWAIT.timeout($$$)
      matches: awaitility-chain
    - pattern: $RECEIVER.$METHOD($TIMEOUT, $UNIT)
      all:
        - has:
            field: arguments
            has:
              nthChild:
                position: 1
                reverse: true
              regex: (^|\.)(NANOSECONDS|MICROSECONDS|MILLISECONDS|SECONDS|MINUTES|HOURS|DAYS)$|[uU]nit$
              not:
                regex: ChronoUnit
        - not:
            has:
              field: name
              regex: ^(plus|minus|of|truncatedTo|until|between|convert|getExpire|expire)$
