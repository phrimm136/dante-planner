id: no-logging-in-rules
language: Java
severity: error
message: 'A rule returns violations and logs nothing; logging belongs to the edge that renders them.'
files:
  - src/main/java/org/danteplanner/backend/planner/validation/**
ignores:
  - src/main/java/org/danteplanner/backend/planner/validation/PlannerContentValidator.java
rule:
  pattern: log.$METHOD($$$ARGS)
