id: no-branch-in-outcome-command
language: Java
severity: error
message: 'A command returning an *Outcome branches only by an exhaustive switch over a decision value or a guard (an if without else whose body is one throw); move the condition into a pure method returning a sealed type or enum and switch on it here.'
files:
  - src/main/java/**/*.java
utils:
  guard:
    kind: if_statement
    not:
      has:
        field: alternative
        regex: "."
    has:
      field: consequence
      any:
        - kind: throw_statement
        - all:
            - kind: block
            - has:
                kind: throw_statement
            - not:
                has:
                  nthChild: 2
                  regex: "."
rule:
  any:
    - all:
        - kind: if_statement
        - not:
            matches: guard
    - kind: ternary_expression
  inside:
    kind: method_declaration
    stopBy: end
    has:
      field: type
      regex: Outcome$
