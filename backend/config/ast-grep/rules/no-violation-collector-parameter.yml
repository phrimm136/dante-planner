id: no-violation-collector-parameter
language: Java
severity: error
message: 'A rule returns its List<Violation>; never collect violations through a parameter or ValidationContext.'
files:
  - src/main/java/org/danteplanner/backend/planner/validation/**
  - src/main/java/org/danteplanner/backend/planner/exception/PlannerValidationException.java
rule:
  any:
    - kind: formal_parameter
      all:
        - has: { field: type, regex: '^((List|Collection)<Violation>|List<PlannerValidationException>)$' }
        - not:
            inside:
              kind: formal_parameters
              inside: { kind: record_declaration }
    - kind: type_identifier
      regex: '^ValidationContext$'
