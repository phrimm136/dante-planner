name: PR Gate

# The one verification workflow for code (ADR 517). A pull request runs the fast lanes: the
# frontend checks and the backend unit tier. A push to main runs the full lanes: the whole
# backend check, e2e, both builds and the planted-bug consistency matrix, and that run's success
# is the signal deploy-fleet.yml
# consumes. Both events skip a lane whose inputs did not change; on main the diff starts at the
# last green push run, so a run that a newer push cancelled leaves no change untested, and a
# burst of merges ends in one run and one deploy. Change detection is a job, not a
# workflow-level paths filter: a required check whose workflow never triggers wedges the merge at
# "Expected", while a skipped job satisfies it.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-origin:
    permissions: {}
    uses: ./.github/workflows/check-pr-origin.yml

  changes:
    needs: check-origin
    if: needs.check-origin.outputs.is-internal == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      e2e: ${{ steps.filter.outputs.e2e }}
      deploy: ${{ steps.filter.outputs.deploy }}
      consistency: ${{ steps.filter.outputs.consistency }}
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          match() { printf '%s\n' "$CHANGED" | grep -qE "$1" && echo true || echo false; }

          CONSISTENCY_PATHS='^backend/src/consistency/|^backend/src/test/java/org/danteplanner/consistency/|^backend/src/test/java/org/danteplanner/backend/integration/consistency/|^backend/src/test/java/org/danteplanner/backend/integration/ConsistencyRunIT\.java$|^backend/src/main/java/org/danteplanner/backend/shared/readpath/|^backend/src/main/java/org/danteplanner/backend/shared/gtid/|^backend/src/main/java/org/danteplanner/backend/shared/freshness/|^backend/src/main/java/org/danteplanner/backend/shared/config/(ReadOnlyRoutingDataSource|ReadSource[A-Za-z]*|RoutingDataSourceConfig|PoolLedger)\.java$|^backend/src/main/java/org/danteplanner/backend/planner/service/PlannerCommandService\.java$|^backend/src/main/java/org/danteplanner/backend/planner/service/PlannerCatalogService\.java$|^backend/src/main/java/org/danteplanner/backend/planner/service/PublishedPlannerQueryService\.java$|^backend/src/main/java/org/danteplanner/backend/planner/service/PlannerQueryService\.java$|^backend/src/main/java/org/danteplanner/backend/planner/api/PlannerMiss\.java$|^backend/src/main/java/org/danteplanner/backend/user/service/UserSettingsService\.java$|^backend/src/main/java/org/danteplanner/backend/comment/service/CommentQueryService\.java$|^backend/src/test/java/org/danteplanner/backend/integration/OregonContext\.java$|^backend/src/test/java/org/danteplanner/backend/integration/ReplicationControl\.java$|^backend/src/test/java/org/danteplanner/backend/integration/CausalHarnessSupport\.java$|^backend/src/test/java/org/danteplanner/backend/integration/ReplicaRoutingHarnessSupport\.java$|^backend/build\.gradle\.kts$|^backend/src/test/resources/consistency/|^scripts/consistency/|^\.github/workflows/pr-gate\.yml$'

          if [ "$EVENT_NAME" = "push" ]; then
            BASE_SHA=$(gh run list -R "$REPO" --workflow pr-gate.yml --event push --branch main \
              --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
            if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              echo "no green push run to diff from: every lane runs"
              for area in backend frontend e2e deploy terraform consistency; do echo "$area=true" >> "$GITHUB_OUTPUT"; done
              exit 0
            fi
          fi
          CHANGED=$(git diff --name-only "$BASE_SHA"...HEAD)
          printf '%s\n' "$CHANGED"

          lane_paths() {
            local list
            if ! list=$("$1" --list-inputs) || [ -z "$list" ]; then
              echo "::error::$1 --list-inputs failed or printed nothing; the lane filter cannot be built" >&2
              return 1
            fi
            printf '%s\n' "$list" | sed -e 's/[][\.*^$+?(){}|]/\\&/g' -e 's/.*/^&(\/|$)/' | paste -sd '|' -
          }
          BACKEND_PATHS=$(lane_paths .github/scripts/backend-test-inputs.sh) || exit 1
          FRONTEND_PATHS=$(lane_paths .github/scripts/frontend-inputs.sh) || exit 1
          E2E_PATHS=$(lane_paths .github/scripts/e2e-inputs.sh) || exit 1
          DEPLOY_PATHS=$(lane_paths .github/scripts/deploy-test-inputs.sh) || exit 1
          TERRAFORM_PATHS=$(lane_paths .github/scripts/terraform-inputs.sh) || exit 1

          echo "backend=$(match "$BACKEND_PATHS")" >> "$GITHUB_OUTPUT"
          echo "frontend=$(match "$FRONTEND_PATHS")" >> "$GITHUB_OUTPUT"
          echo "e2e=$(match "$E2E_PATHS")" >> "$GITHUB_OUTPUT"
          echo "deploy=$(match "$DEPLOY_PATHS")" >> "$GITHUB_OUTPUT"
          echo "terraform=$(match "$TERRAFORM_PATHS")" >> "$GITHUB_OUTPUT"
          echo "consistency=$(match "$CONSISTENCY_PATHS")" >> "$GITHUB_OUTPUT"

  check-keep-list:
    needs: check-origin
    if: needs.check-origin.outputs.is-internal == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - name: Install PyYAML and pytest
        id: pyyaml
        run: python -m pip install pyyaml==6.0.3 pytest==9.2.0
      - name: Remote-write keep list covers alerts and panels
        if: ${{ !cancelled() && steps.pyyaml.outcome == 'success' }}
        run: python scripts/ops/check-remote-write-keep-list.py
      - name: Lane input lists cover every Dockerfile COPY source and every ../ path the builds read
        if: ${{ !cancelled() }}
        run: .github/scripts/check-deploy-inputs.sh
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        if: ${{ !cancelled() }}
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - name: Skill CLI, git-hook and ops script test suites
        if: ${{ !cancelled() }}
        run: .github/scripts/tooling-tests.sh

  test-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/fetch-static-checkout
        with:
          static-deploy-key: ${{ secrets.STATIC_DEPLOY_KEY }}
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Restore file permissions
        run: chmod +x backend/gradlew
      - name: Restore Gradle caches
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('backend/*.gradle.kts', 'backend/gradle/**') }}
          restore-keys: gradle-${{ github.workflow }}-${{ github.job }}-
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      - name: FE Install for ast-grep
        working-directory: ./frontend
        run: yarn install --frozen-lockfile
      - name: BE Test
        working-directory: ./backend
        env:
          UNIT_ONLY: ${{ github.event_name == 'pull_request' && '-PexcludeTags=containerized' || '' }}
        run: ./gradlew check -q --continue $UNIT_ONLY
      - name: Every planted bug applies and compiles
        run: scripts/consistency/planted-bugs.sh compile
      - name: Save Gradle caches
        if: github.ref == 'refs/heads/main' && success() && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/checkstyle/
            backend/build/reports/cpd/
            backend/build/reports/tests/
            backend/build/test-results/
          retention-days: 7

  test-deploy:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - name: Install PyYAML
        run: python -m pip install pyyaml==6.0.3
      - name: Render, validate and serve the deploy manifests
        run: .github/scripts/deploy-test.sh

  test-terraform:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - name: Restore Terraform plugin cache
        id: terraform-plugin-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-plugins-${{ hashFiles('terraform/**/.terraform.lock.hcl') }}
          restore-keys: terraform-plugins-
      - name: Format check, then init without a backend and validate every root stack
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          .github/scripts/terraform-validate.sh
      - name: Save Terraform plugin cache
        if: github.ref == 'refs/heads/main' && success() && steps.terraform-plugin-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ steps.terraform-plugin-cache.outputs.cache-primary-key }}

  scan-config:
    needs: changes
    if: needs.changes.outputs.deploy == 'true' || needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - name: Install PyYAML
        run: python -m pip install pyyaml==6.0.3
      - name: Scan the Terraform and rendered Kubernetes configuration against the baselines
        run: .github/scripts/config-scan.sh
      - name: Config scan scenarios
        run: .github/config-scan/test.sh

  test-migration:
    needs: changes
    if: needs.changes.outputs.backend == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: danteplanner
          MYSQL_USER: danteplanner
          MYSQL_PASSWORD: danteplanner
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect new migrations
        id: detect
        run: |
          MIGRATION_DIR="backend/src/main/resources/db/migration"
          NEW_FILES=$(git diff --name-only --diff-filter=A origin/main...HEAD -- "${MIGRATION_DIR}/*.sql" || true)

          if [ -z "$NEW_FILES" ]; then
            echo "No new migration files detected"
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "New migrations:"
          echo "$NEW_FILES"
          echo "has_new=true" >> "$GITHUB_OUTPUT"

          BASE_VERSION=$(git ls-tree --name-only origin/main "${MIGRATION_DIR}/" \
            | sed -n 's/.*\/V\([0-9]\+\)__.*/\1/p' | sort -n | tail -1)
          echo "base version: ${BASE_VERSION}"
          echo "base_version=${BASE_VERSION}" >> "$GITHUB_OUTPUT"

      # Pinned to the flyway-core version in backend/build.gradle.kts; bump both together.
      - name: Migrate to the base-branch version
        if: steps.detect.outputs.has_new == 'true'
        env:
          BASE_VERSION: ${{ steps.detect.outputs.base_version }}
        run: |
          docker run --rm --network host \
            -v "$PWD/backend/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:12.4.0 \
            -url="jdbc:mysql://127.0.0.1:3306/danteplanner?serverTimezone=UTC&allowPublicKeyRetrieval=true" \
            -user=danteplanner -password=danteplanner \
            -locations=filesystem:/flyway/sql \
            -target="$BASE_VERSION" \
            -validateOnMigrate=false -baselineOnMigrate=false migrate

      - name: Run seed data
        if: steps.detect.outputs.has_new == 'true'
        run: |
          # Seed with the BASE branch copy: the seed runs after the merged
          # migrations and before the PR's new ones, so it must match the
          # base-branch schema even when this PR changes both schema and seed.
          SEED_PATH="backend/src/test/resources/db/seed/migration-test-seed.sql"
          git show "origin/main:${SEED_PATH}" > /tmp/base-seed.sql 2>/dev/null \
            || cp "${SEED_PATH}" /tmp/base-seed.sql
          mysql -h 127.0.0.1 -u danteplanner -pdanteplanner danteplanner \
            < /tmp/base-seed.sql

      - name: Run the new migrations against populated tables
        if: steps.detect.outputs.has_new == 'true'
        run: |
          docker run --rm --network host \
            -v "$PWD/backend/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:12.4.0 \
            -url="jdbc:mysql://127.0.0.1:3306/danteplanner?serverTimezone=UTC&allowPublicKeyRetrieval=true" \
            -user=danteplanner -password=danteplanner \
            -locations=filesystem:/flyway/sql \
            -validateOnMigrate=false -baselineOnMigrate=false migrate

  consistency-variants:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.consistency == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      variants: ${{ steps.list.outputs.variants }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: List the clean app and every planted bug
        id: list
        run: |
          VARIANTS=$(for patch in backend/src/test/resources/consistency/planted/*.patch; do
            basename "$patch" .patch
          done | python3 -c 'import json,sys; print(json.dumps(["clean"] + sys.stdin.read().split(), separators=(",", ":")))')
          echo "$VARIANTS"
          echo "variants=$VARIANTS" >> "$GITHUB_OUTPUT"

  consistency:
    needs: consistency-variants
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.consistency-variants.outputs.variants) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/fetch-static-checkout
        with:
          static-deploy-key: ${{ secrets.STATIC_DEPLOY_KEY }}
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Restore file permissions
        run: chmod +x backend/gradlew
      - name: Restore Gradle caches
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('backend/*.gradle.kts', 'backend/gradle/**') }}
          restore-keys: gradle-${{ github.workflow }}-${{ github.job }}-
      - name: Run the variant
        run: scripts/consistency/planted-bugs.sh ${{ matrix.variant }} --seeds 20
      - name: Save Gradle caches
        if: github.ref == 'refs/heads/main' && success() && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
      - name: Upload consistency reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: consistency-${{ matrix.variant }}
          path: |
            backend/build/consistency/
            backend/build/test-results/test/
          retention-days: 7

  consistency-result:
    needs: [changes, consistency-variants, consistency]
    if: always() && needs.changes.result != 'skipped'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every consistency variant passed or the area was not touched
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          VARIANTS_RESULT: ${{ needs.consistency-variants.result }}
          CONSISTENCY_RESULT: ${{ needs.consistency.result }}
        run: |
          echo "changes=$CHANGES_RESULT consistency-variants=$VARIANTS_RESULT consistency=$CONSISTENCY_RESULT"
          [ "$CHANGES_RESULT" = success ] || exit 1
          for result in "$VARIANTS_RESULT" "$CONSISTENCY_RESULT"; do
            case $result in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done

  build-backend:
    # e2e is a superset of both build conditions, so it never skips out from under a build.
    needs: [changes, test-backend, e2e]
    if: github.event_name == 'push' && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/fetch-static-checkout
        with:
          static-deploy-key: ${{ secrets.STATIC_DEPLOY_KEY }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Mock Build Backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ./backend/Dockerfile
          build-contexts: static=./static
          push: false
          tags: ci/danteplanner-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  test-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/fetch-static-checkout
        with:
          static-deploy-key: ${{ secrets.STATIC_DEPLOY_KEY }}
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      - name: FE Install
        id: fe-install
        working-directory: ./frontend
        run: yarn install --frozen-lockfile
      - name: FE Typecheck
        if: ${{ !cancelled() && steps.fe-install.outcome == 'success' }}
        working-directory: ./frontend
        run: yarn typecheck
      - name: FE Test
        if: ${{ !cancelled() && steps.fe-install.outcome == 'success' }}
        working-directory: ./frontend
        run: yarn test:coverage
      - name: FE Lint
        if: ${{ !cancelled() && steps.fe-install.outcome == 'success' }}
        working-directory: ./frontend
        run: yarn lint
      - name: FE Validation Lint
        if: ${{ !cancelled() && steps.fe-install.outcome == 'success' }}
        working-directory: ./frontend
        run: yarn lint:validation
      - name: FE False Positive Scan
        if: ${{ !cancelled() && steps.fe-install.outcome == 'success' }}
        working-directory: ./frontend
        run: yarn check:fp
      - name: FE Rule Tests
        if: ${{ !cancelled() && steps.fe-install.outcome == 'success' }}
        working-directory: ./frontend
        run: yarn check:rules
      - name: FE Compiler Bailouts
        if: ${{ !cancelled() && steps.fe-install.outcome == 'success' }}
        working-directory: ./frontend
        run: yarn check:compiler-bailouts
      - name: FE Format Check
        if: ${{ !cancelled() && steps.fe-install.outcome == 'success' }}
        working-directory: ./frontend
        run: yarn fmt:check

  build-frontend:
    needs: [changes, test-frontend, e2e]
    if: github.event_name == 'push' && needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/fetch-static-checkout
        with:
          static-deploy-key: ${{ secrets.STATIC_DEPLOY_KEY }}
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      - name: FE Build
        timeout-minutes: 12
        working-directory: ./frontend
        run: |
          yarn install --frozen-lockfile
          yarn build
          yarn check:bundle-budget
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'

  e2e:
    needs: changes
    if: >-
      github.event_name == 'push' && (
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.e2e == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/fetch-static-checkout
        with:
          static-deploy-key: ${{ secrets.STATIC_DEPLOY_KEY }}
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: |
            e2e/yarn.lock
            frontend/yarn.lock

      - name: Ban networkidle in the browser suites
        run: |
          if grep -rn "networkidle" e2e/src e2e/tests; then
            echo "::error::An authenticated page holds an SSE connection open, so networkidle" \
                 "never fires. Wait on domcontentloaded plus an explicit assertion."
            exit 1
          fi

      # Throwaway credentials for the rig; same values the mysql service job uses. The rig
      # script and the seeder read them from the environment, not from .env.
      - name: Write compose environment
        id: compose-env
        if: ${{ !cancelled() }}
        run: |
          cat > .env <<'EOF'
          MYSQL_ROOT_PASSWORD=testpass
          MYSQL_DATABASE=danteplanner
          MYSQL_USER=danteplanner
          MYSQL_PASSWORD=danteplanner
          STUB_CLIENT_SECRET=stub-secret
          EOF
          cat .env >> "$GITHUB_ENV"
          sed -n 's/^MYSQL_USER=/E2E_DB_USER=/p; s/^MYSQL_PASSWORD=/E2E_DB_PASSWORD=/p' .env \
            >> "$GITHUB_ENV"

      # nginx serves ./frontend/dist through the docker-compose.e2e.yml bind mount and the
      # image ships no build of its own, so an unbuilt SPA 404s every route the suites request.
      - name: Build the SPA
        id: build-spa
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'
        run: |
          yarn --cwd frontend install --frozen-lockfile
          yarn --cwd frontend build

      - name: Install e2e dependencies
        id: e2e-install
        if: ${{ !cancelled() }}
        run: yarn --cwd e2e install --frozen-lockfile

      - name: E2E Typecheck
        if: ${{ !cancelled() && steps.e2e-install.outcome == 'success' }}
        run: yarn --cwd e2e typecheck

      - name: E2E Format Check
        if: ${{ !cancelled() && steps.e2e-install.outcome == 'success' }}
        run: yarn --cwd e2e fmt:check

      - name: Set up JDK 25
        id: setup-java
        if: ${{ !cancelled() }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle
          cache-read-only: true

      - name: Build the backend jar
        id: backend-jar
        if: ${{ !cancelled() && steps.setup-java.outcome == 'success' }}
        run: |
          chmod +x backend/gradlew
          backend/gradlew -p backend bootJar --no-daemon

      - name: Bring up the two-region rig
        id: rig
        if: ${{ !cancelled() && steps.compose-env.outcome == 'success' && steps.build-spa.outcome == 'success' && steps.backend-jar.outcome == 'success' }}
        env:
          JAR_STAGE: jar-prebuilt
        run: |
          yarn --cwd e2e stack:up:rig
          # The rig publishes no host port for the primary, so the seeder dials the bridge.
          echo "E2E_DB_HOST=$(docker inspect -f \
            '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' limbusplanner-mysql-1)" \
            >> "$GITHUB_ENV"

      - name: Run contract and app suites
        if: ${{ !cancelled() && steps.rig.outcome == 'success' && steps.e2e-install.outcome == 'success' }}
        env:
          # Suites sign with the same test keypair the override mounts into the backend;
          # without this, auth.ts falls back to Secrets Manager via a CLI profile no runner has.
          E2E_STAGING_KEY_FILE: ${{ github.workspace }}/backend/src/test/resources/test-keys/private_key.pem
        run: |
          yarn --cwd e2e playwright install chromium
          yarn --cwd e2e test:contract
          yarn --cwd e2e test:app

      - name: Dump backend logs
        if: failure()
        run: yarn --cwd e2e stack:logs
