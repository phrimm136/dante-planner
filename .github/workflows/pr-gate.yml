name: PR Gate

# The one verification workflow for code. Pull requests get change-filtered blocking lanes;
# every push to main gets an unconditional full run, and that run's success is the signal the
# deploy pipeline consumes. Change detection is a job, not a workflow-level paths filter: a
# required check whose workflow never triggers wedges the merge at "Expected", while a skipped
# job satisfies it.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-origin:
    permissions: {}
    uses: ./.github/workflows/check-pr-origin.yml

  changes:
    needs: check-origin
    if: needs.check-origin.outputs.is-internal == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            for area in backend frontend e2e; do echo "$area=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE_SHA"...HEAD)
          printf '%s\n' "$CHANGED"
          match() { printf '%s\n' "$CHANGED" | grep -qE "$1" && echo true || echo false; }

          BACKEND_PATHS='^backend/'
          FRONTEND_PATHS='^frontend/'
          E2E_PATHS='^(e2e|static)/'

          echo "backend=$(match "$BACKEND_PATHS")" >> "$GITHUB_OUTPUT"
          echo "frontend=$(match "$FRONTEND_PATHS")" >> "$GITHUB_OUTPUT"
          echo "e2e=$(match "$E2E_PATHS")" >> "$GITHUB_OUTPUT"

  test-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: ./.github/actions/fetch-static-submodule
        with:
          static-deploy-key: ${{ secrets.STATIC_DEPLOY_KEY }}
      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95  # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Restore file permissions
        run: chmod +x backend/gradlew
      - name: BE Test
        working-directory: ./backend
        run: ./gradlew check -q
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/
            backend/build/test-results/
          retention-days: 7

  test-migration:
    needs: changes
    if: needs.changes.outputs.backend == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: danteplanner
          MYSQL_USER: danteplanner
          MYSQL_PASSWORD: danteplanner
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0

      - name: Detect new migrations
        id: detect
        run: |
          MIGRATION_DIR="backend/src/main/resources/db/migration"
          NEW_FILES=$(git diff --name-only --diff-filter=A origin/main...HEAD -- "${MIGRATION_DIR}/*.sql" || true)

          if [ -z "$NEW_FILES" ]; then
            echo "No new migration files detected"
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "New migrations:"
          echo "$NEW_FILES"
          echo "has_new=true" >> "$GITHUB_OUTPUT"

          BASE_VERSION=$(git ls-tree --name-only origin/main "${MIGRATION_DIR}/" \
            | sed -n 's/.*\/V\([0-9]\+\)__.*/\1/p' | sort -n | tail -1)
          echo "base version: ${BASE_VERSION}"
          echo "base_version=${BASE_VERSION}" >> "$GITHUB_OUTPUT"

      # Pinned to the flyway-core version in backend/build.gradle.kts; bump both together.
      - name: Migrate to the base-branch version
        if: steps.detect.outputs.has_new == 'true'
        env:
          BASE_VERSION: ${{ steps.detect.outputs.base_version }}
        run: |
          docker run --rm --network host \
            -v "$PWD/backend/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:11.7.2 \
            -url="jdbc:mysql://127.0.0.1:3306/danteplanner?serverTimezone=UTC" \
            -user=danteplanner -password=danteplanner \
            -locations=filesystem:/flyway/sql \
            -target="$BASE_VERSION" \
            -validateOnMigrate=false -baselineOnMigrate=false migrate

      - name: Run seed data
        if: steps.detect.outputs.has_new == 'true'
        run: |
          # Seed with the BASE branch copy: the seed runs after the merged
          # migrations and before the PR's new ones, so it must match the
          # base-branch schema even when this PR changes both schema and seed.
          SEED_PATH="backend/src/test/resources/db/seed/migration-test-seed.sql"
          git show "origin/main:${SEED_PATH}" > /tmp/base-seed.sql 2>/dev/null \
            || cp "${SEED_PATH}" /tmp/base-seed.sql
          mysql -h 127.0.0.1 -u danteplanner -pdanteplanner danteplanner \
            < /tmp/base-seed.sql

      - name: Run the new migrations against populated tables
        if: steps.detect.outputs.has_new == 'true'
        run: |
          docker run --rm --network host \
            -v "$PWD/backend/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:11.7.2 \
            -url="jdbc:mysql://127.0.0.1:3306/danteplanner?serverTimezone=UTC" \
            -user=danteplanner -password=danteplanner \
            -locations=filesystem:/flyway/sql \
            -validateOnMigrate=false -baselineOnMigrate=false migrate

  build-backend:
    needs: [changes, test-backend]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The Dockerfile bakes static/data (private submodule) into the image, so
      # the build needs the submodule-initialized tree and a repo-root context.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: ./.github/actions/fetch-static-submodule
        with:
          static-deploy-key: ${{ secrets.STATIC_DEPLOY_KEY }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Mock Build Backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: ci/danteplanner-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  test-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: ./.github/actions/fetch-static-submodule
        with:
          static-deploy-key: ${{ secrets.STATIC_DEPLOY_KEY }}
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      - name: FE Install
        working-directory: ./frontend
        run: yarn install --frozen-lockfile
      - name: FE Typecheck
        working-directory: ./frontend
        run: yarn typecheck
      - name: FE Test
        working-directory: ./frontend
        run: yarn test:coverage
      - name: FE Lint
        working-directory: ./frontend
        run: yarn lint
      - name: FE False Positive Scan
        working-directory: ./frontend
        run: yarn check:fp
      - name: FE Rule Tests
        working-directory: ./frontend
        run: yarn check:rules
      - name: FE Compiler Bailouts
        working-directory: ./frontend
        run: yarn check:compiler-bailouts
      - name: FE Format Check
        working-directory: ./frontend
        run: yarn fmt:check

  build-frontend:
    needs: [changes, test-frontend]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: ./.github/actions/fetch-static-submodule
        with:
          static-deploy-key: ${{ secrets.STATIC_DEPLOY_KEY }}
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      - name: FE Build
        timeout-minutes: 12
        working-directory: ./frontend
        run: |
          yarn install --frozen-lockfile
          yarn build
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'

  e2e:
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: ./.github/actions/fetch-static-submodule
        with:
          static-deploy-key: ${{ secrets.STATIC_DEPLOY_KEY }}
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: |
            e2e/yarn.lock
            frontend/yarn.lock

      - name: Ban networkidle in the browser suites
        run: |
          if grep -rn "networkidle" e2e/src e2e/tests; then
            echo "::error::An authenticated page holds an SSE connection open, so networkidle" \
                 "never fires. Wait on domcontentloaded plus an explicit assertion."
            exit 1
          fi

      # Throwaway credentials for the rig; same values the mysql service job uses. The rig
      # script and the seeder read them from the environment, not from .env.
      - name: Write compose environment
        run: |
          cat > .env <<'EOF'
          MYSQL_ROOT_PASSWORD=testpass
          MYSQL_DATABASE=danteplanner
          MYSQL_USER=danteplanner
          MYSQL_PASSWORD=danteplanner
          STUB_CLIENT_SECRET=stub-secret
          EOF
          cat .env >> "$GITHUB_ENV"
          sed -n 's/^MYSQL_USER=/E2E_DB_USER=/p; s/^MYSQL_PASSWORD=/E2E_DB_PASSWORD=/p' .env \
            >> "$GITHUB_ENV"

      # nginx serves ./frontend/dist through the docker-compose.e2e.yml bind mount and the
      # image ships no build of its own, so an unbuilt SPA 404s every route the suites request.
      - name: Build the SPA
        timeout-minutes: 12
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'
        run: |
          yarn --cwd frontend install --frozen-lockfile
          yarn --cwd frontend build

      - name: Bring up the two-region rig
        run: |
          yarn --cwd e2e stack:up:rig
          # The rig publishes no host port for the primary, so the seeder dials the bridge.
          echo "E2E_DB_HOST=$(docker inspect -f \
            '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' limbusplanner-mysql-1)" \
            >> "$GITHUB_ENV"

      - name: Run contract and app suites
        env:
          # Suites sign with the same test keypair the override mounts into the backend;
          # without this, auth.ts falls back to Secrets Manager via a CLI profile no runner has.
          E2E_STAGING_KEY_FILE: ${{ github.workspace }}/backend/src/test/resources/test-keys/private_key.pem
        run: |
          yarn --cwd e2e install --frozen-lockfile
          yarn --cwd e2e playwright install chromium
          yarn --cwd e2e test:contract
          yarn --cwd e2e test:app

      - name: Dump backend logs
        if: failure()
        run: yarn --cwd e2e stack:logs

  notify-failure:
    needs: [test-backend, test-migration, build-backend, test-frontend, build-frontend, e2e]
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/notify-ci-failure
        with:
          title: CI Failed — PR Gate
          pr-number: ${{ github.event.pull_request.number }}
          jobs-json: |
            [
              {"name": "BE Test", "result": "${{ needs.test-backend.result }}"},
              {"name": "Migration", "result": "${{ needs.test-migration.result }}"},
              {"name": "BE Build", "result": "${{ needs.build-backend.result }}"},
              {"name": "FE Test", "result": "${{ needs.test-frontend.result }}"},
              {"name": "FE Build", "result": "${{ needs.build-frontend.result }}"},
              {"name": "E2E", "result": "${{ needs.e2e.result }}"}
            ]
