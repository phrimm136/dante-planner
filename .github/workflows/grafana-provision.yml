name: Grafana provision

on:
  push:
    branches: [main]
    paths:
      - 'deploy/grafana/**'
      - 'terraform/modules/fleet/variables.tf'
      - 'scripts/ops/lib/etcd-interval.sh'
      - '.github/workflows/grafana-provision.yml'
  workflow_dispatch:

concurrency:
  group: grafana-provision
  cancel-in-progress: false

jobs:
  provision:
    name: Provision Grafana objects
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - name: Install PyYAML
        run: python -m pip install pyyaml==6.0.3

      - name: Import alert rules and the fleet dashboard
        env:
          GRAFANA_URL: ${{ vars.GRAFANA_URL }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
          CW_DS_UID: ${{ vars.CW_DS_UID }}
          LOKI_DS_UID: ${{ vars.LOKI_DS_UID }}
        run: |
          set -euo pipefail
          bash deploy/grafana/import-alert-rules.sh
          bash deploy/grafana/import-app-alert-rules.sh
          bash deploy/grafana/import-fleet-dashboard.sh

      - name: Refuse duplicate and undeclared live alert rules
        env:
          GRAFANA_URL: ${{ vars.GRAFANA_URL }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
        run: bash deploy/grafana/check-alert-rules.sh
