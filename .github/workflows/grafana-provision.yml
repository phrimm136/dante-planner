name: Grafana provision

on:
  push:
    branches: [main]
    paths:
      - 'deploy/grafana/**'
      - '.github/workflows/grafana-provision.yml'
  workflow_dispatch:

concurrency:
  group: grafana-provision
  cancel-in-progress: false

jobs:
  provision:
    name: Provision Grafana objects
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Import alert rules and the fleet dashboard
        env:
          GRAFANA_URL: ${{ vars.GRAFANA_URL }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
          ETCD_INTERVAL: ${{ vars.ETCD_INTERVAL }}
          CW_DS_UID: ${{ vars.CW_DS_UID }}
          LOKI_DS_UID: ${{ vars.LOKI_DS_UID }}
        run: |
          set -euo pipefail
          bash deploy/grafana/import-alert-rules.sh
          bash deploy/grafana/import-app-alert-rules.sh
          bash deploy/grafana/import-fleet-dashboard.sh
