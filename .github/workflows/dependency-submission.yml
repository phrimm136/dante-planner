name: Dependency Submission

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - name: Restore file permissions
        run: chmod +x backend/gradlew
      - name: Submit the backend's resolved dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6.4.1
        with:
          build-root-directory: backend
          cache-disabled: true
          dependency-graph: generate-and-submit
