name: Dependency Submission

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Restore file permissions
        run: chmod +x backend/gradlew
      - name: Restore Gradle caches
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('backend/*.gradle.kts', 'backend/gradle/**') }}
          restore-keys: gradle-${{ github.workflow }}-${{ github.job }}-
      - name: Submit the backend's resolved dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6.4.1
        env:
          DEPENDENCY_GRAPH_RUNTIME_INCLUDE_CONFIGURATIONS: 'productionRuntimeClasspath|runtimeClasspath'
        with:
          build-root-directory: backend
          cache-disabled: true
          dependency-graph: generate-and-submit
      - name: Save Gradle caches
        if: github.ref == 'refs/heads/main' && success() && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
