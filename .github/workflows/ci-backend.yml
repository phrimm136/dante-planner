name: CI Backend

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main, staging, dev]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

jobs:
  check-origin:
    permissions: {}
    uses: ./.github/workflows/check-pr-origin.yml

  test-backend:
    needs: check-origin
    if: >-
      needs.check-origin.outputs.is-internal == 'true' ||
      github.base_ref == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: ./.github/actions/fetch-static-submodule
        with:
          static-deploy-key: ${{ secrets.STATIC_DEPLOY_KEY }}
      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95  # v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Restore file permissions
        run: chmod +x backend/gradlew

      - name: BE Test
        working-directory: ./backend
        run: ./gradlew check -q

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/tests/
            backend/build/test-results/
          retention-days: 7

  test-migration:
    needs: check-origin
    if: >-
      needs.check-origin.outputs.is-internal == 'true' ||
      github.base_ref == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: danteplanner
          MYSQL_USER: danteplanner
          MYSQL_PASSWORD: danteplanner
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0

      - name: Detect new migrations
        id: detect
        run: |
          MIGRATION_DIR="backend/src/main/resources/db/migration"
          NEW_FILES=$(git diff --name-only --diff-filter=A origin/main...HEAD -- "${MIGRATION_DIR}/*.sql" || true)

          if [ -z "$NEW_FILES" ]; then
            echo "No new migration files detected"
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "New migrations:"
          echo "$NEW_FILES"
          echo "has_new=true" >> "$GITHUB_OUTPUT"

          BASE_VERSION=$(git ls-tree --name-only origin/main "${MIGRATION_DIR}/" \
            | sed -n 's/.*\/V\([0-9]\+\)__.*/\1/p' | sort -n | tail -1)
          echo "base version: ${BASE_VERSION}"
          echo "base_version=${BASE_VERSION}" >> "$GITHUB_OUTPUT"

      # Pinned to the flyway-core version in backend/build.gradle.kts; bump both together.
      - name: Migrate to the base-branch version
        if: steps.detect.outputs.has_new == 'true'
        env:
          BASE_VERSION: ${{ steps.detect.outputs.base_version }}
        run: |
          docker run --rm --network host \
            -v "$PWD/backend/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:11.7.2 \
            -url="jdbc:mysql://127.0.0.1:3306/danteplanner?serverTimezone=UTC" \
            -user=danteplanner -password=danteplanner \
            -locations=filesystem:/flyway/sql \
            -target="$BASE_VERSION" \
            -validateOnMigrate=false -baselineOnMigrate=false migrate

      - name: Run seed data
        if: steps.detect.outputs.has_new == 'true'
        run: |
          # Seed with the BASE branch copy: the seed runs after the merged
          # migrations and before the PR's new ones, so it must match the
          # base-branch schema even when this PR changes both schema and seed.
          SEED_PATH="backend/src/test/resources/db/seed/migration-test-seed.sql"
          git show "origin/main:${SEED_PATH}" > /tmp/base-seed.sql 2>/dev/null \
            || cp "${SEED_PATH}" /tmp/base-seed.sql
          mysql -h 127.0.0.1 -u danteplanner -pdanteplanner danteplanner \
            < /tmp/base-seed.sql

      - name: Run the new migrations against populated tables
        if: steps.detect.outputs.has_new == 'true'
        run: |
          docker run --rm --network host \
            -v "$PWD/backend/src/main/resources/db/migration:/flyway/sql:ro" \
            flyway/flyway:11.7.2 \
            -url="jdbc:mysql://127.0.0.1:3306/danteplanner?serverTimezone=UTC" \
            -user=danteplanner -password=danteplanner \
            -locations=filesystem:/flyway/sql \
            -validateOnMigrate=false -baselineOnMigrate=false migrate

  build-backend:
    needs: [check-origin, test-backend]
    if: >-
      needs.check-origin.outputs.is-internal == 'true' ||
      github.base_ref == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The Dockerfile bakes static/data (private submodule) into the image, so
      # the build needs the submodule-initialized tree and a repo-root context.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: ./.github/actions/fetch-static-submodule
        with:
          static-deploy-key: ${{ secrets.STATIC_DEPLOY_KEY }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Mock Build Backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: ci/danteplanner-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  notify-failure:
    needs: [test-backend, test-migration, build-backend]
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/notify-ci-failure
        with:
          title: CI Failed — Backend
          pr-number: ${{ github.event.pull_request.number }}
          jobs-json: |
            [
              {"name": "Test", "result": "${{ needs.test-backend.result }}"},
              {"name": "Migration", "result": "${{ needs.test-migration.result }}"},
              {"name": "Build", "result": "${{ needs.build-backend.result }}"}
            ]
