name: CI Frontend

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [main, staging, dev]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'

jobs:
  check-origin:
    permissions: {}
    uses: ./.github/workflows/check-pr-origin.yml

  test-frontend:
    needs: check-origin
    if: >-
      needs.check-origin.outputs.is-internal == 'true' ||
      github.base_ref == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: ./.github/actions/fetch-static-submodule
        with:
          static-deploy-key: ${{ secrets.STATIC_DEPLOY_KEY }}
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: FE Test
        working-directory: ./frontend
        run: |
          yarn install --frozen-lockfile
          yarn test

      - name: FE Lint
        working-directory: ./frontend
        run: yarn lint

      - name: FE Format Check
        working-directory: ./frontend
        run: yarn fmt:check

  build-frontend:
    needs: [check-origin, test-frontend]
    if: >-
      needs.check-origin.outputs.is-internal == 'true' ||
      github.base_ref == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: ./.github/actions/fetch-static-submodule
        with:
          static-deploy-key: ${{ secrets.STATIC_DEPLOY_KEY }}
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: FE Build
        timeout-minutes: 12
        working-directory: ./frontend
        run: |
          yarn install --frozen-lockfile
          yarn build
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'

  notify-failure:
    needs: [test-frontend, build-frontend]
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/notify-ci-failure
        with:
          title: CI Failed — Frontend
          pr-number: ${{ github.event.pull_request.number }}
          jobs-json: |
            [
              {"name": "Test", "result": "${{ needs.test-frontend.result }}"},
              {"name": "Build", "result": "${{ needs.build-frontend.result }}"}
            ]
