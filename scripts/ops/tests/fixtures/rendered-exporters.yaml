apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysqld-exporter
  namespace: danteplanner
  labels:
    helm.sh/chart: prometheus-mysql-exporter-2.17.1
    app.kubernetes.io/name: prometheus-mysql-exporter
    app.kubernetes.io/instance: mysqld-exporter
    app.kubernetes.io/version: "v0.21.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-mysql-exporter
      app.kubernetes.io/instance: mysqld-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus-mysql-exporter
        app.kubernetes.io/instance: mysqld-exporter
        app: mysqld-exporter
      annotations:
        checksum/credentials: 01ba4719c80b6fe911b091a7c05124b64eeece964e09c058ef8f9805daca546b
        prometheus.io/job: mysqld
        prometheus.io/path: /metrics
        prometheus.io/port: "9104"
        prometheus.io/scrape: "true"
    spec:
      serviceAccountName: default
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus-mysql-exporter
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          image: "quay.io/prometheus/mysqld-exporter:v0.21.0"
          imagePullPolicy: IfNotPresent
          args:
            - "--config.my-cnf=/etc/cnf/my.cnf"
            - --mysqld.address=$(MYSQLD_ADDRESS)
            - --mysqld.username=$(MYSQL_EXPORTER_USER)
            - "--collect.perf_schema.eventsstatements"
            - "--collect.perf_schema.tableiowaits"
          env:
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
            - name: MYSQLD_ADDRESS
              valueFrom:
                secretKeyRef:
                  key: endpoint
                  name: mysqld-exporter-dsn
            - name: MYSQL_EXPORTER_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: mysqld-exporter-dsn
            - name: MYSQLD_EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: mysqld-exporter-dsn
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
          ports:
            - containerPort: 9104
          livenessProbe:
            httpGet:
              path: /
              port: 9104
          readinessProbe:
            httpGet:
              path: /
              port: 9104
          volumeMounts:
            - name: secret-config
              mountPath: /etc/cnf/
              readOnly: true
            - mountPath: /etc/mysqld-certs
              name: rds-ca
              readOnly: true
      nodeSelector:
        role: data
      volumes:
        - name: secret-config
          secret:
            secretName: mysqld-exporter-dsn
        - configMap:
            name: rds-ca-bundle
          name: rds-ca
